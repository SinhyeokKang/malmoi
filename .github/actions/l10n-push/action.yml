# 대상 리포가 부르는 진입점. 로케일 파일을 적재하고 사용처를 스캔해 `/api/push`로 보낸다.
#
# **`scripts/push-local.ts`를 그대로 부른다.** 페이로드를 셸·YAML로 조립하지 않는 것이 요지다 —
# 거기엔 컴파일러가 없어서 계약이 넓어져도 아무도 모른다 (docs/POSTMORTEM.md 2026-08-31).
# 생산자는 `lib/push/payload.ts` 하나이고 이 action은 그 경로를 지난다.
#
# ⚠️ **i18n-poc가 private이라 대상 리포에서 이 action을 쓰려면 접근 허용이 필요하다**:
# i18n-poc > Settings > Actions > General > "Accessible from repositories owned by ...".
# 안 켜면 대상 리포 run이 `unable to resolve action`으로 죽는다.
#
# 대상 리포의 워크플로 예시는 docs/ACTIONS.md에 있다.
name: l10n push
description: 로케일 파일을 DB로 올린다 (적재 + 사용처 스캔 → /api/push)

inputs:
  push-token:
    description: /api/push의 Bearer 토큰. 대상 리포 secret에 둔다
    required: true
  project:
    description: 대상 Project.slug. 서버의 ACTIVE_PROJECT_SLUG와 다르면 409다
    required: true
  api-url:
    description: i18n-poc 배포 URL
    required: false
    default: https://i18n-poc.vercel.app
  target:
    description: 스캔·적재 대상 디렉터리. 기본은 대상 리포 체크아웃 루트다
    required: false
    default: ${{ github.workspace }}
  adapter:
    description: |
      어댑터 명시 지정. **한 리포에 포맷이 둘이면 필수다** — 탐지 우선순위가 작은 쪽을
      골라 큰 쪽 키가 전부 orphan된다 (bugshot-2: _locales 4키 vs ts-dict 903키).
    required: false
    default: ""
  base-locale:
    description: |
      기준 로케일 명시. **`en`이 없는 리포는 필수다** — 없으면 사전순 첫 로케일을 base로 추정하고,
      추정이 틀리면 진짜 base에만 있는 키가 적재에서 빠져 orphaned로 떨어진다 (키 집합은 base
      파일이 정한다).
    required: false
    default: ""
  wrapper:
    description: |
      `--wrapper` 스펙. 여러 개면 줄바꿈으로 나눈다.
      끝에 `()`를 붙이면 훅이다 (예: next-intl#useTranslations()).
    required: false
    default: ""
  github-token:
    description: |
      열린 `l10n/sync` PR을 경고하는 데만 쓴다. 주지 않으면 그 단계를 건너뛴다.
      **쓰기에는 쓰지 않는다** — 리포 쓰기는 i18n-poc의 GitHub App이 맡는다.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ⚠️ **무한 루프 차단을 action 안에도 둔다.** 대상 리포 워크플로의 `if:`가 1차 방어지만 그건
    # 복붙 스니펫(docs/ACTIONS.md)이라 빠뜨릴 수 있다. pull이 만든 `[skip-l10n]` 커밋이 머지될 때
    # push가 다시 돌면 DB를 리포 값으로 덮고 다음 pull이 또 PR을 만든다 (2026-09-04 audit #16).
    # composite action은 job-level if가 없어 스텝마다 `steps.guard.outputs.skip`으로 건너뛴다.
    - name: "[skip-l10n] 가드"
      id: guard
      shell: bash
      env:
        HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [[ "$HEAD_MESSAGE" == *"[skip-l10n]"* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::[skip-l10n] 커밋 — pull이 만든 변경이라 push하지 않는다"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # composite action은 자기 리포를 러너에 clone해 준다. `action_path`는 이 파일의
    # 디렉터리(`<clone>/.github/actions/l10n-push`)이므로 **리포 루트는 `../../..`다.**
    #
    # ⚠️ **버전을 파일에서 읽어 값으로 넘긴다.** `pnpm/action-setup`의 `package_json_file`과
    # `setup-node`의 `node-version-file`은 **워크스페이스 기준 상대경로**로 해석돼서, 절대경로를
    # 줘도 action의 clone 경로를 못 본다("No pnpm version is specified"로 죽는다). 값으로
    # 넘기면 그 문제를 피하면서 버전의 출처는 여전히 i18n-poc의 `.nvmrc`·`packageManager` 하나다.
    - name: 버전 읽기
      if: steps.guard.outputs.skip != 'true'
      id: v
      shell: bash
      run: |
        set -euo pipefail
        root="${{ github.action_path }}/../../.."
        echo "node=$(tr -d '[:space:]' < "$root/.nvmrc")" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(node -p "require('$root/package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

    - name: pnpm
      if: steps.guard.outputs.skip != 'true'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.v.outputs.pnpm }}

    - name: Node
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.v.outputs.node }}

    - name: i18n-poc 의존성
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: pnpm install --frozen-lockfile

    # ⚠️ **차단이 아니라 경고다.** strict라 이 PR이 머지되기 전의 push는 번역자의 편집을
    # 지운다 (MVP §3.1의 손실 창). 막으면 병합 판정이 되어 코어 원칙을 깨므로, 개발자가
    # 판단할 재료만 남긴다.
    # ⚠️ **`--repo`를 명시한다.** 이 스텝의 작업 디렉터리는 호출자(대상 리포)지만 `gh`가
    # 무엇을 컨텍스트로 잡는지에 의존하면 조용히 엉뚱한 리포를 조회한다 — 첫 실행에서 PR이
    # 열려 있는데 "없음"이 나왔다.
    # ⚠️ **조회 실패를 "PR 없음"으로 읽지 않는다.** `2>/dev/null || true`가 그렇게 만들어서
    # 경고가 존재하지 않는 것과 구별되지 않았다. 실패는 실패로 보고한다(단 red는 아니다 —
    # 이 스텝은 경고 전용이고 적재를 막을 근거가 없다).
    - name: 열린 l10n/sync PR 경고
      if: steps.guard.outputs.skip != 'true' && inputs.github-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        if ! out=$(gh pr list --repo "$REPO" --head l10n/sync --state open --json url --jq '.[0].url // ""' 2>&1); then
          echo "::warning title=번역 PR 조회 실패::$out — 열린 PR이 있는지 확인하지 못했다"
          exit 0
        fi
        if [ -n "$out" ]; then
          echo "::warning title=머지되지 않은 번역 PR::$out — 이 push가 그 PR의 편집을 덮는다 (MVP 3.1의 손실 창). 머지한 뒤 다시 push하는 것을 권한다"
        else
          echo "열린 l10n/sync PR 없음 (조회 성공)"
        fi

    # **적재 실패만 red다.** 스캔 실패는 경고이고 `pnpm scan`은 항상 exit 0이다 —
    # 키의 진실은 로케일 파일이고 스캔은 refs 전담이라, 남의 리포 CI를 우리 스캐너
    # 규칙으로 실패시키지 않는다 (ARCHITECTURE §4).
    - name: 적재 + 스캔 → /api/push
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      # inputs는 env로 넘기고 셸에서 "$VAR"로 읽는다 — `${{ }}`를 스크립트에 직접 보간하면 호출자가
      # 이벤트 데이터를 input에 연결했을 때 스크립트 인젝션 경로가 된다.
      env:
        PUSH_TOKEN: ${{ inputs.push-token }}
        L10N_API_URL: ${{ inputs.api-url }}
        L10N_PROJECT: ${{ inputs.project }}
        L10N_ADAPTER: ${{ inputs.adapter }}
        L10N_BASE: ${{ inputs.base-locale }}
        L10N_WRAPPER: ${{ inputs.wrapper }}
        L10N_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        args=(--url "$L10N_API_URL" --project "$L10N_PROJECT")
        if [ -n "$L10N_ADAPTER" ]; then
          args+=(--adapter "$L10N_ADAPTER")
        fi
        if [ -n "$L10N_BASE" ]; then
          args+=(--base "$L10N_BASE")
        fi
        # 줄바꿈으로 나뉜 wrapper 스펙을 각각 플래그로 전개한다.
        while IFS= read -r spec; do
          spec="$(echo "$spec" | tr -d '[:space:]')"
          [ -n "$spec" ] && args+=(--wrapper "$spec")
        done <<< "$L10N_WRAPPER"
        echo "pnpm push:local $L10N_TARGET ${args[*]}"
        pnpm push:local "$L10N_TARGET" "${args[@]}"

name: CI

# main 단일 브랜치라 PR 이벤트가 발생하지 않는다. 따라서 이 워크플로는 **게이트가 아니라
# 사후 확인**이다 — push가 곧 Vercel 프로덕션 배포이고 CI는 그 뒤에 돈다.
# 프로덕션 앞의 유일한 게이트는 /push 1단계의 로컬 typecheck + test다.
#
# 그래도 CI를 두는 이유 셋:
#   1. 로컬 환경 의존성을 걷어낸 깨끗한 체크아웃에서 도는지 확인
#   2. 다른 창구(웹 UI·Codex·다른 머신)에서 들어온 커밋 검증
#   3. Codex 미러 드리프트 차단
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma 클라이언트는 gitignore된 생성물이라 typecheck 전에 만들어야 한다.
      # **더미 DIRECT_URL을 주지 않는다** — prisma.config.ts가 datasource를 조건부로 넣게
      # 바뀌어 generate는 URL 없이 돈다. 이 스텝이 그 사실의 상시 검증을 겸한다:
      # 여기서 죽으면 `.env.local`이 없는 환경(Vercel·새 체크아웃)의 빌드도 죽는다.
      # 조건 없이 돈다 — 전에 붙어 있던 `if: hashFiles('prisma/schema.prisma') != ''`는 항상 참이라
      # 무의미했고, 경로가 바뀌면 generate가 조용히 skip돼 typecheck가 원인 불명으로 죽었다.
      - name: prisma generate
        run: pnpm db:generate

      - run: pnpm typecheck

      - run: pnpm test

      # 미러는 CLAUDE.md·.claude/commands/의 순수 생성물이다. 드리프트가 올라오면
      # Codex 세션이 오래된 지침을 읽게 되므로 여기서 막는다.
      - name: Codex 미러 드리프트
        run: pnpm sync:agents:check

name: CI

# 브랜치가 둘이 되면서(2026-09-04) 이 워크플로는 **프로덕션 앞의 게이트**가 됐다 —
# dev→main PR에 붙는 run이 그것이다. 그전에는 main 단일이라 PR 이벤트가 없었고,
# CI는 배포가 끝난 뒤에 도는 사후 확인이었다.
#
# 트리거가 셋인 이유가 각각 다르다:
#   - push [dev]  : dev에 깨진 것이 쌓이지 않게 한다. preview 배포와 같은 커밋을 검증한다
#   - pull_request [main] : **머지 게이트.** 이 체크가 green이어야 /merge가 프로덕션으로 보낸다
#   - push [main] : 머지 뒤 확인 + 다른 창구(웹 UI·Codex·다른 머신)가 main을 직접 친 경우
#
# dev push와 PR이 같은 SHA에 두 번 도는 것은 의도된 중복이다 — PR 체크로 표시돼야
# 머지 게이트가 되고, dev push run은 PR을 열기 전에도 결론을 준다.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma 클라이언트는 gitignore된 생성물이라 typecheck 전에 만들어야 한다.
      # **더미 DIRECT_URL을 주지 않는다** — prisma.config.ts가 datasource를 조건부로 넣게
      # 바뀌어 generate는 URL 없이 돈다. 이 스텝이 그 사실의 상시 검증을 겸한다:
      # 여기서 죽으면 `.env.local`이 없는 환경(Vercel·새 체크아웃)의 빌드도 죽는다.
      # 조건 없이 돈다 — 전에 붙어 있던 `if: hashFiles('prisma/schema.prisma') != ''`는 항상 참이라
      # 무의미했고, 경로가 바뀌면 generate가 조용히 skip돼 typecheck가 원인 불명으로 죽었다.
      - name: prisma generate
        run: pnpm db:generate

      - run: pnpm typecheck

      - run: pnpm test

      # 미러는 CLAUDE.md·.claude/commands/의 순수 생성물이다. 드리프트가 올라오면
      # Codex 세션이 오래된 지침을 읽게 되므로 여기서 막는다.
      - name: Codex 미러 드리프트
        run: pnpm sync:agents:check

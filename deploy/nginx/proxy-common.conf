# 모든 proxy location이 include한다. ⚠️ nginx의 add_header는 location에 add_header가 하나라도 있으면 바깥 것을 상속하지 않는다 —
# 그래서 HSTS를 server가 아니라 이 조각에 두고 location마다 문다(테스트가 센다).

# 원래 Host를 그대로 넘긴다 — 기본값(`$proxy_host` = "web:3000")이면 앱의 requestOrigin 판정이 전부 null이 되고
# 로그인 리다이렉트도 깨진다(self-hosting design §2). 앱은 MALMOI_ORIGIN과 정확히 같은 host만 받는다.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_http_version 1.1;
proxy_set_header Connection "";

# HSTS 덮어쓰기 — 앱은 hosted 값(includeSubDomains; preload)을 빌드에 고정해 낸다. 그대로 두면 설치 호스트 아래 다른 서비스까지
# HTTPS로 강제하고, 덧붙이면 헤더가 둘 나간다. 숨긴 뒤 하나만 단다.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=63072000" always;

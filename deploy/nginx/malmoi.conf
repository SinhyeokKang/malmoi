# Malmoi 셀프 호스팅 proxy 예제 (self-hosting design §2·§5). TLS 인증서는 운영자가 붙인다 — 아래 경로·호스트는 자리표시자다.
#
# ⚠️ 이 파일의 rate limit이 hosted Vercel WAF 규칙(OPERATIONS "Vercel WAF rate limit")의 대체다 — 앱 코드에는 제한이 없다.
#    `/api/images/`(무인증, 요청마다 sharp)와 `/oauth/authorize`(무인증 GET 하나가 외부 fetch + 행 삽입)를 같은 값으로 막는다.
#    **이 예제를 바꾸거나 다른 proxy로 옮기며 빠뜨리면 그 보호가 사라진다.**

# hosted와 같은 값 — 두 경로가 IP당 카운터 하나(600/60s)를 나눠 쓴다. burst는 한 화면이 이미지를 병렬로 부르는 몫이다
# (nginx는 rate를 ms 단위로 고르게 펴므로 burst 없이는 동시 요청 둘째부터 거절된다).
limit_req_zone $binary_remote_addr zone=malmoi_public:10m rate=600r/m;
limit_req_status 429;

# web을 요청마다(10초 캐시) Docker 내장 DNS로 다시 해석한다 — `upstream { server web:3000; }`은 nginx 기동 때 IP를 고정해서,
# web만 재생성되면(.env를 고치고 `docker compose up -d`) proxy가 옛 IP로 영구 502를 낸다. 변수 proxy_pass여야 resolver를 쓴다.
resolver 127.0.0.11 valid=10s ipv6=off;

# ⚠️ access log에 비밀을 남기지 않는다 — 이미지 기본 형식(`main`)은 `$request`·`$http_referer`로 `/invite/<token>`(7일 유효한 수락
# 자격)·`/signin/link/<challenge>`·OAuth `code`·`state`를 그대로 남겼다(B7 실습). query와 referer는 싣지 않고, 경로는 decode·정규화된
# `$uri`(`/%69nvite/…`도 `/invite/…`)에서 토큰 자리를 가린다. **모든 server가 이 형식을 명시한다** — 빠뜨린 server는 기본 형식을 상속한다.
map $uri $malmoi_log_uri {
    ~^/invite/       /invite/<redacted>;
    ~^/signin/link/  /signin/link/<redacted>;
    default          $uri;
}
log_format malmoi_redacted '$remote_addr [$time_local] "$request_method $malmoi_log_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name malmoi.example.com;
    access_log /var/log/nginx/access.log malmoi_redacted;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name malmoi.example.com;
    access_log /var/log/nginx/access.log malmoi_redacted;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # /api/push 본문 상한(4.5 MB)과 Server Action 상한(4 MB) 위다 — nginx 기본 1 MB면 이미지 업로드·적재가 413으로 끊긴다.
    client_max_body_size 5m;

    set $malmoi_web http://web:3000;

    location ^~ /api/images/ {
        limit_req zone=malmoi_public burst=100 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $malmoi_web;
    }

    location = /oauth/authorize {
        limit_req zone=malmoi_public burst=100 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $malmoi_web;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $malmoi_web;
    }
}

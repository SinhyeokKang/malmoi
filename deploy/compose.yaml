# Malmoi 셀프 호스팅 — 단일 서버 Compose (self-hosting design §5·§6).
#
#   cp .env.example .env    # 값을 채운다 — compose가 이 디렉터리의 .env를 보간에 쓴다
#   docker compose up -d
#
# 순서: postgres healthy → migrate(마이그레이션 + bootstrap) 성공 → web healthy → proxy·scheduler.
# 컨테이너가 "실행 중"이라는 사실은 준비를 뜻하지 않으므로 service_healthy·service_completed_successfully로 묶는다.
#
# 업그레이드: MALMOI_IMAGE를 새 태그(가능하면 @sha256 digest)로 바꾸고
#   docker compose pull --ignore-buildable && docker compose run --rm migrate && docker compose up -d --force-recreate web proxy scheduler
# ⚠️ migrate의 과거 성공을 재사용하지 않는다 — 새 릴리스의 마이그레이션을 새로 돌린 뒤 web을 같은 이미지로 재생성한다
#    (POSTMORTEM 2026-09-14 — 낡은 Prisma 클라이언트가 새 스키마를 조회했다).
#
# 비밀은 서비스마다 필요한 것만 준다 — superuser 비밀번호는 postgres에만, 스케줄러는 CRON_SECRET만, web은 DDL 자격증명을 받지 않는다.
# web의 environment 키 집합은 preflight 표(`lib/deployment/preflight.ts`의 required·optional)와 같아야 한다(테스트가 센다).

name: malmoi

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: malmoi
      MIGRATE_DB_PASSWORD: "${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 빈 볼륨에서 한 번만 돈다 — 마이그레이션 롤(DB 소유 비-superuser)을 만든다.
      - ./postgres/10-migrate-role.sh:/docker-entrypoint-initdb.d/10-migrate-role.sh:ro
    # ⚠️ ports를 열지 않는다 — DB는 내부망(db)에만 있다(POSTMORTEM 2026-09-09 DB 직접 공개).
    networks: [db]
    healthcheck:
      # ⚠️ TCP(-h 127.0.0.1)로 묻는다 — 소켓으로 물으면 빈 볼륨 초기화 동안의 임시 서버(listen_addresses='')를 healthy로 보고
      #    migrate가 TCP로 붙다가 거부된다(restart: "no"라 첫 설치가 확률적으로 실패한다).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "malmoi", "-q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: "${MALMOI_IMAGE:?set MALMOI_IMAGE, e.g. ghcr.io/sinhyeokkang/malmoi:v1.2.7}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DIRECT_URL: "postgresql://malmoi_migrate:${MIGRATE_DB_PASSWORD}@postgres:5432/malmoi"
      # bootstrap(psql)의 접속 — 비밀번호를 명령줄에 싣지 않는다.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: malmoi
      PGUSER: malmoi_migrate
      PGPASSWORD: "${MIGRATE_DB_PASSWORD}"
      RUNTIME_DB_PASSWORD: "${RUNTIME_DB_PASSWORD:?set RUNTIME_DB_PASSWORD}"
      # db 망은 바깥으로 못 나간다 — Prisma CLI의 버전 확인 호출을 끈다.
      CHECKPOINT_DISABLE: "1"
    command:
      - sh
      - -c
      - >-
        pnpm exec prisma migrate deploy &&
        psql -X -v ON_ERROR_STOP=1 -v runtime_role=malmoi_app -v migrate_role=malmoi_migrate -f deploy/bootstrap.sql
    networks: [db]

  web:
    image: "${MALMOI_IMAGE:?set MALMOI_IMAGE, e.g. ghcr.io/sinhyeokkang/malmoi:v1.2.7}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MALMOI_ORIGIN: "${MALMOI_ORIGIN:?set MALMOI_ORIGIN}"
      MALMOI_UPLOAD_DIR: /data/uploads
      MALMOI_PRIVACY_URL: "${MALMOI_PRIVACY_URL:?set MALMOI_PRIVACY_URL}"
      # Auth.js의 origin은 MALMOI_ORIGIN과 같아야 한다(preflight가 단언한다) — 여기서 한 값으로 묶는다.
      AUTH_URL: "${MALMOI_ORIGIN}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET}"
      AUTH_GITHUB_ID: "${AUTH_GITHUB_ID}"
      AUTH_GITHUB_SECRET: "${AUTH_GITHUB_SECRET}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"
      APP_SIGNING_SECRET: "${APP_SIGNING_SECRET}"
      # 런타임 롤(bootstrap이 만든다) — DML만 가진다.
      DATABASE_URL: "postgresql://malmoi_app:${RUNTIME_DB_PASSWORD}@postgres:5432/malmoi"
      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG}"
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET}"
      TOKEN_ENCRYPTION_KEYS: "${TOKEN_ENCRYPTION_KEYS}"
      TOKEN_ENCRYPTION_ACTIVE_KEY_ID: "${TOKEN_ENCRYPTION_ACTIVE_KEY_ID}"
      PII_ENCRYPTION_KEYS: "${PII_ENCRYPTION_KEYS}"
      PII_ENCRYPTION_ACTIVE_KEY_ID: "${PII_ENCRYPTION_ACTIVE_KEY_ID}"
      EMAIL_LOOKUP_KEY: "${EMAIL_LOOKUP_KEY}"
      EMAIL_LOOKUP_KEY_ID: "${EMAIL_LOOKUP_KEY_ID}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      INVITATION_EMAIL_FROM: "${INVITATION_EMAIL_FROM}"
      OPERATOR_EMAILS: "${OPERATOR_EMAILS:-}"
    volumes:
      - uploads:/data/uploads
    # ⚠️ ports를 열지 않는다 — 앱 포트는 proxy만 본다. 바깥 Host를 위조해 직접 붙는 길을 닫는다.
    networks: [edge, db]
    # readiness = DB ping + 자기 포트 리슨 (design §5). 마이그레이션은 migrate 성공이, 설정·업로드 경로는 preflight가 이미 보장한다.
    # 공개 route를 새로 만들지 않는다 — 리슨 확인은 로컬 TCP 연결뿐이다.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h postgres -p 5432 -d malmoi -q &&
          node -e "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/malmoi.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      # 운영자가 붙이는 인증서 — fullchain.pem·privkey.pem
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]

  scheduler:
    build: ./scheduler
    image: malmoi-scheduler:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: "${CRON_SECRET}"
      TZ: UTC
    networks: [edge]

networks:
  edge: {}
  # 바깥으로 나가는 길이 없는 망 — postgres·migrate는 인터넷을 보지 않는다.
  db:
    internal: true

volumes:
  pgdata: {}
  uploads: {}
